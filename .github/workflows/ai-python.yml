name: Validate AI Python
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: ai/requirements-live-tester-win-cp312.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-live-tester-win-cp312.lock
      - name: Install project
        run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m black --check .
      - run: python -m flake8 src tests scripts
      - run: python -m pytest tests -q -ra -p no:cacheprovider
